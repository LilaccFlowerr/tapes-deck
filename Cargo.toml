[package]
name = "tapesgui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
slint = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"

# Slint is far too slow to animate smoothly unoptimized, so optimize dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
