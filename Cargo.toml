[package]
name = "tapes-deck"
version = "0.2.0-beta"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
slint = "1.18.1"
toml_edit = "0.25.18"

[build-dependencies]
slint-build = "1.18.1"

# Slint is far too slow to animate smoothly unoptimized, so optimize dependencies even in debug builds.
[profile.dev.package."*"]
opt-level = 3
