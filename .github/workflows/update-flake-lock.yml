name: Update flake.lock

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at 00:00 UTC

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update tapes flake input
        uses: DeterminateSystems/update-flake-lock@main
        with:
          inputs: tapes
          pr-title: "chore(nix): update tapes flake input"
          pr-labels: |
            dependencies
            nix
