[tape]
name = "@NAME@"
desc = "illogical-impulse: usability-first dotfiles for Hyprland by end-4 (the config folders only)."
# What this tape needs. tapes-deck does not install these: use your package manager.
dependencies = [
    "hyprland",
    "quickshell",
    "matugen",
    "kitty",
    "foot",
    "fuzzel",
    "fish",
    "kvantum",
    "wlogout",
    "mpv",
    "git",
]

[hooks]
# Every hook ends well: tapes-v2 skips the rest of the hooks after one that fails.
insert = [
    "hyprctl reload",
    "pkill -x qs || true",
    "qs -c ii -d",
]
eject = [
    "hyprctl reload",
    "pkill -x qs || true",
]
