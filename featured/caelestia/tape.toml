[tape]
name = "@NAME@"
desc = "A fluid, morphing interface to your Linux desktop (the caelestia dots with their default settings)."
# What this tape needs. tapes-deck does not install these: use your package manager.
dependencies = [
    "caelestia-cli",
    "quickshell",
    "hyprland",
    "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-gtk",
    "ttf-jetbrains-mono-nerd",
    "fish",
    "eza",
    "zoxide",
    "direnv",
    "foot",
    "fastfetch",
    "btop",
    "micro",
    "thunar",
    "starship",
    "adw-gtk-theme",
    "papirus-icon-theme",
    "papirus-folders",
    "qtengine",
    "frameworkintegration",
    "darkly-bin",
    "gnome-keyring",
    "polkit-gnome",
    "networkmanager",
    "bluez",
    "bluez-utils",
    "pipewire",
    "pipewire-pulse",
    "pipewire-audio",
    "pipewire-alsa",
    "pipewire-jack",
    "wireplumber",
    "pwvucontrol",
    "wl-clipboard",
    "cliphist",
    "noto-fonts",
    "noto-fonts-cjk",
    "noto-fonts-emoji",
    "curl",
    "git",
    "trash-cli",
    "jq",
    "lazygit",
    "bat",
    "ripgrep",
    "ydotool",
    "hyprpicker",
    "xdg-user-dirs",
    "ddcutil",
    "brightnessctl",
    "libcava",
    "lm_sensors",
    "aubio",
    "libpipewire",
    "libqalculate",
    "power-profiles-daemon",
    "ttf-material-symbols-variable",
    "ttf-rubik-vf",
    "ttf-cascadia-code-nerd",
    "swappy",
    "qt6-base",
    "qt6-declarative",
    "qt6-imageformats",
    "qt6-multimedia",
    "bash",
]

[hooks]
# Every hook ends well: tapes-v2 skips the rest of the hooks after one that fails.
insert = [
    "hyprctl reload",
    "pkill -x qs || true",
    "caelestia shell -d",
]
eject = [
    "hyprctl reload",
    "pkill -x qs || true",
]
