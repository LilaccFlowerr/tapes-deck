[tape]
name = "@NAME@"
desc = "A fluid, morphing interface to your Linux desktop (the caelestia dots with their default settings)."
dependencies = [
    "caelestia-shell",
    "caelestia-cli",
    "hyprland",
    "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-gtk",
    "ttf-jetbrains-mono-nerd",
    "fish",
    "eza",
    "zoxide",
    "direnv",
    "foot",
    "fastfetch",
    "btop",
    "micro",
    "thunar",
    "starship",
    "adw-gtk-theme",
    "papirus-icon-theme",
    "papirus-folders",
    "qtengine",
    "frameworkintegration",
    "darkly-bin",
    "gnome-keyring",
    "polkit-gnome",
    "networkmanager",
    "bluez",
    "bluez-utils",
    "pipewire",
    "pipewire-pulse",
    "pipewire-audio",
    "pipewire-alsa",
    "pipewire-jack",
    "wireplumber",
    "pwvucontrol",
    "wl-clipboard",
    "cliphist",
    "noto-fonts",
    "noto-fonts-cjk",
    "noto-fonts-emoji",
    "curl",
    "git",
    "trash-cli",
    "jq",
    "lazygit",
    "bat",
    "ripgrep",
    "ydotool",
    "hyprpicker",
    "xdg-user-dirs",
]

[hooks]
# Every hook ends well: tapes-v2 skips the rest of the hooks after one that fails.
insert = [
    "mkdir -p $HOME/.config/caelestia",
    "touch $HOME/.config/caelestia/user-config.fish",
    '''sh -c 'mkdir -p ~/.local/state/tapes-deck && ps -C qs -o args= > ~/.local/state/tapes-deck/previous-shell; true' ''',
    "hyprctl reload",
    "pkill -x qs || true",
    '''sh -c 'test -f ~/.local/state/caelestia/scheme.json || caelestia scheme set -n caelestia' ''',
    "caelestia shell -d >/dev/null",
    '''sh -c 'killall -USR2 btop 2>/dev/null || true' ''',
]
eject = [
    "hyprctl reload",
    "pkill -x qs || true",
    '''sh -c 'f=~/.local/state/tapes-deck/previous-shell; [ -f "$f" ] && while read -r cmd; do [ -n "$cmd" ] && setsid -f sh -c "$cmd" >/dev/null 2>&1; done < "$f"; true' ''',
]
